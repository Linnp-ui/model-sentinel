# L1 规则集：按 priority 升序匹配，命中即停（数字小者优先，default_allow 恒垫底）。
# 热重载（按文件 mtime 自动重读，不用重启）；但写错 action/priority 越界/缺 name 时
# Pydantic 强校验会让每个请求都报 ValidationError，改对前网关不可用。
# action: allow=放行外网 | route_local=降级内网模型 | block=拦截（实际行为看 routing.yaml 的 on_block）
# target: 仅 route_local 用，省略时走 routing.yaml 的 default_local。
# when 支持 ==/!=/in/contains_any/matches_regex/>=/<=，any/all 可嵌套；
# 数值比较必须写成 "- 字段 >=: 值"（裸 "- 字段 >= 值" 会被 YAML 解析成字符串）。
# 完整规则语义见 README「策略说明」；管理台规则页可增删改并干跑测试。
policies:
- name: block_secrets
  priority: 3
  action: block
  description: 密钥/私钥 直接拦截（DeepSeek sk-+32hex / AWS AKIA / PEM / Anthropic / GitHub
    / aws_secret）。priority 3 压过全部 route_local 规则：block 的安全语义优先于命中频率序—— 否则 PII 加权 p5
    抢先命中，reject 模式（on_block=reject）对密钥永远 403 不了（2026-10-19 红队）
  when:
    any:
    - text matches_regex: AKIA[0-9A-Z]{16}
    - text matches_regex: '-----BEGIN (RSA )?PRIVATE KEY-----'
    - text matches_regex: sk-[0-9a-fA-F]{32}
    - text contains_any:
      - sk-ant-
      - ghp_
      - aws_secret
- name: tainted_file_ref
  priority: 5
  action: route_local
  description: 文件名污染（客户端无感的会话替代）：同一 key 下曾判机密的文件名被正文提及即走本地，TTL 同 session
  when:
    any:
    - tainted_file.hit == true: true
  target:
    provider: vllm_local
    model: qwen2.5:7b
- name: financial_local_only
  priority: 10
  action: route_local
  description: 财务表格：命中财务关键词才走内网（保持默认）
  when:
    any:
    - file.sheet_names contains_any:
      - 工资
      - 薪资
      - 财务
      - 预算
      - 决算
      - 成本
      - 营收
      - 利润
      - 资产负债
    - file.headers contains_any:
      - 姓名
      - 身份证
      - 工资
      - 薪资
      - 银行账号
      - 银行卡
      - 金额
      - 成本
      - 利润
      - 营收
    - file.filename contains_any:
      - 工资
      - 薪资
      - 财务
      - 预算
      - salary
      - financial
      - cost
    - text contains_any:
      - 财务报表
      - 资产负债
      - 利润表
  target:
    provider: vllm_local
    model: qwen2.5:7b
- name: session_route_local
  priority: 12
  action: route_local
  description: 会话级路由本地：会话内出现机密判定（机密文件 / 纯文本 L1 命中 / L2 判密）后，同会话 chat/messages/responses
    请求自动走本地模型；TTL 随 AI_GATEWAY_SESSION_TTL（默认 30 分钟，生产 .env 为 7 天），可用性兜底转本地不标记
  when:
    any:
    - session.confidential == true: true
  target:
    provider: vllm_local
    model: qwen2.5:7b
- name: unparsed_binary_route_local
  priority: 13
  description: 'P0-3b fix: 扩展名伪装 / 未知或损坏二进制（magic 嗅探失败或富格式分支解析失败） -> fail-CLOSED route_local，取代旧的「把二进制
    dump 成文本 -> 抽不出关键词 -> allow」'
  when:
    any:
    - findings.unparsed_binary == true: true
    - findings.parse_failed == true: true
  action: route_local
  target:
    provider: vllm_local
    model: qwen2.5:7b
- name: pii_weighted_route_local
  priority: 20
  action: route_local
  description: PII 加权评分 >= 60 转内网 (身份证 70/银行卡 Luhn 60; 密钥类 90+)
  when:
    any:
    - findings.weighted_pii_score >=: 60
  target:
    provider: vllm_local
    model: qwen2.5:7b
- name: ocr_empty_image_route_local
  priority: 30
  action: route_local
  description: 图片走了 OCR 但没识别出任何文字（OCR 引擎缺失 / 文件损坏 / 不支持的格式）
    ⇒ fail-closed 转内网，不 fail-open 放行（P0-3）
  when:
    any:
    - findings.ocr_empty_and_image == true: true
  target:
    provider: vllm_local
    model: qwen2.5:7b
- name: drawing_local_only
  priority: 40
  action: route_local
  description: 设计图纸：CAD 文件（dwg/dxf/rvt/skp）无条件转内网；其他文件含机密/保密水印或图纸领域关键词转内网。 纯文本只提词不带内容仍放行（security_testset
    drawing_*_pass 钉死口径）
  when:
    any:
    - file.ext in:
      - dwg
      - dxf
      - rvt
      - skp
    - file.text contains_any:
      - 机密
      - 保密
      - 内部资料
      - 不得外传
      - confidential
      - secret
      - 图纸
      - 施工图
      - 结构图
      - 竣工图
      - 图号
      - blueprint
      - CAD
      - BIM
    - file.watermark contains_any:
      - 机密
      - 保密
      - confidential
      - secret
    - file.filename contains_any:
      - 机密
      - 保密
      - confidential
      - secret
      - 图纸
      - 施工图
      - 结构图
      - 竣工图
      - 图号
      - blueprint
      - CAD
      - BIM
  target:
    provider: vllm_local
    model: qwen2.5:7b
  match:
    combiner: any
    rows:
    - content_type: ext
      match_type: in
      match_value: dwg, dxf, rvt, skp
    - content_type: file
      match_type: contains
      match_value: 机密, 保密, 内部资料, 不得外传, confidential, secret, 图纸, 施工图, 结构图, 竣工图, 图号,
        blueprint, CAD, BIM
    - content_type: watermark
      match_type: contains
      match_value: 机密, 保密, confidential, secret
    - content_type: filename
      match_type: contains
      match_value: 机密, 保密, confidential, secret, 图纸, 施工图, 结构图, 竣工图, 图号, blueprint,
        CAD, BIM
- name: default_allow
  priority: 100
  description: 默认外网（provider 留空 = 用 routing.yaml 的 default_external）
  when: always
  action: allow
