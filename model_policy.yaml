model_policy:
  external_candidates:
  - provider: deepseek
    model: deepseek-flash
    price_per_1m_in: 2.0
    price_per_1m_out: 4.0
    price_per_1m_cached: 0.04
    context_length: 1000000
    note: deepseek 官方（价格单位 ¥/1M tokens）
