# 模型策略：mtime 热重载，改完不用重启。
# external_candidates  外网候选池：按 (rank, 价格) 升序切换，rank 小者优先
# internal_models      内网模型登记（展示 + route_local 降级目标）
# model_limits         模型级限流（RPM）；load_balance_mode 当前只支持 none
# review_model         L2 审查模型：threshold=判密阈值（运行时可调），scopes=送审文本范围
model_policy:
  external_candidates:
  - provider: deepseek
    model: deepseek-flash
    price_per_1m_in: 2.0
    price_per_1m_out: 4.0
    price_per_1m_cached: 0.04
    context_length: 1000000
    note: deepseek 官方（价格单位 ¥/1M tokens）
    enabled: true
    rank: 1
    input: [text, image]  # 2026-10-27 实测：图片内嵌读出图中文字
  - provider: deepseek
    model: deepseek-v4-pro
    price_per_1m_in: 9.0
    price_per_1m_out: 13.5
    price_per_1m_cached: 0.3
    context_length: 1000000
    note: （价格单位 ¥/1M tokens）
    enabled: true
    rank: 2
    input: [text]  # 2026-10-27 实测：200 但 reasoning 自述「图片不支持无法查看」，静默降级
  internal_models:
  - provider: vllm_local
    model: qwen2.5:7b
    note: 主力本地模型（内容不出境降级目标）
    enabled: true
    url: http://10.0.0.10:8000/v1
    input: [text, image]  # 2026-10-27 实测：VL，识别图中文字正确
  - provider: vllm_l2
    model: Qwen3-4B-Instruct-2507
    note: L2 审查 qwen（8002，可路由）
    enabled: true
    url: http://10.0.0.10:8002/v1
  - provider: laya
    model: laya-multilingual
    note: L2 审查 laya（8003 /classify 决策模型，非 chat 协议，仅审查下拉可选，不暴露）
    enabled: true
    url: http://127.0.0.1:8003/classify
  model_limits: []
  load_balance_mode: none
  review_model:
    threshold: 0.7
    scopes:
    - last_user
    - tool
    - history
    - long_text
    chunk_chars: 1200
    budget_chars: 6000
    note: ''
