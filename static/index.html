<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Secure Gateway Demo — 图纸/财务表格 内网路由</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family: ui-sans-serif, system-ui; max-width:900px; margin:32px auto; padding:0 16px; color:#1a1a1a}
.card{border:1px solid #e5e7eb; border-radius:12px; padding:20px; margin:16px 0; background:#fff}
.badge{display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600}
.allow{background:#dcfce7; color:#166534}
.route_local{background:#dbeafe; color:#1e40af}
.block{background:#fee2e2; color:#991b1b}
pre{background:#0f172a; color:#e2e8f0; padding:12px; border-radius:8px; overflow:auto; font-size:13px}
input,textarea,button{font-size:14px}
button{background:#111827; color:#fff; border:0; padding:8px 16px; border-radius:8px; cursor:pointer}
label{font-weight:600; font-size:13px}
</style>
</head>
<body>
<h1>Secure Gateway Demo</h1>
<p>设计图纸 / 财务表格 机密自动转内网模型。API Key 默认 <code>pk_live_dev_changeme</code>，网关 <code>http://localhost:8080</code></p>

<div class="card">
<h3>1) 文本对话测试（OpenAI兼容）</h3>
<label>API Key</label><br><input id="apikey" value="pk_live_dev_changeme" style="width:320px;padding:6px;border:1px solid #ddd;border-radius:6px"><br><br>
<textarea id="prompt" rows="3" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:8px">总结CAP定理一句话</textarea><br><br>
<button onclick="testChat()">发送 /v1/chat/completions</button>
<pre id="chatOut">等待测试...</pre>
</div>

<div class="card">
<h3>2) 文件预检（图纸 / 财务表格）</h3>
<p style="font-size:13px;color:#6b7280">支持 pdf / dwg / xlsx / csv。命中策略自动 <code>route_local -> ollama</code>，不会出境。</p>
<input type="file" id="fileInput" accept=".pdf,.xlsx,.xls,.csv,.dwg,.dxf"><br><br>
<button onclick="testFile()">上传 /v1/files/check</button>
<pre id="fileOut">等待上传...</pre>
<div id="fileBadge"></div>
</div>

<div class="card">
<h3>3) 审计面板</h3>
<a href="/admin" target="_blank">打开 /admin</a> &nbsp;|&nbsp; <a href="/health" target="_blank">/health</a>
</div>

<script>
async function testChat(){
  const key=document.getElementById('apikey').value;
  const prompt=document.getElementById('prompt').value;
  const r=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:prompt}]})});
  const j=await r.json();
  document.getElementById('chatOut').textContent=JSON.stringify(j,null,2);
}
async function testFile(){
  const key=document.getElementById('apikey').value;
  const f=document.getElementById('fileInput').files[0];
  if(!f){alert('先选文件');return}
  const fd=new FormData(); fd.append('file',f);
  const r=await fetch('/v1/files/check',{method:'POST',headers:{'Authorization':'Bearer '+key},body:fd});
  const j=await r.json();
  document.getElementById('fileOut').textContent=JSON.stringify(j,null,2);
  const g=j.gateway||{};
  const badge=document.getElementById('fileBadge');
  badge.innerHTML=`<span class="badge ${g.action}">${g.action} — ${g.policy_rule} -> ${g.provider}/${g.model}</span> <span style="font-size:13px">${j.message||''}</span>`;
}
// 快捷填充示例
</script>
</body>
</html>
