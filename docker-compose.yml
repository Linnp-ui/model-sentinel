services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  gateway:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    # 开发用：明细/审计库指向 MySQL（生产同口径，见 agents/env.md）；
    # 不设 DATABASE_URL / AUDIT_MYSQL_URL 则走内存后端（重启即丢）。
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      AUDIT_MYSQL_URL: ${AUDIT_MYSQL_URL:-}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:8000/v1}
      AI_GATEWAY_POLICY_PATH: /app/policy.yaml
      AI_GATEWAY_DEV_API_KEY: pk_live_dev_changeme
      AI_GATEWAY_RATE_LIMIT_RPM: 120
      OLLAMA_MOCK: ${OLLAMA_MOCK:-false}
    volumes:
      - ./policy.yaml:/app/policy.yaml:ro
      - ./src:/app/src:ro
    command: uvicorn src.gateway.main:app --host 0.0.0.0 --port 8080 --reload
